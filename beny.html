<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset 14 — Progress</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0d0d;
  --surface: #141414;
  --surface2: #1a1a1a;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --gold: #C9A96E;
  --text: #f0ede8;
  --muted: rgba(240,237,232,0.45);
  --muted2: rgba(240,237,232,0.25);
  --green: #4ade80;
  --red: #f87171;
  --amber: #fbbf24;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace;
  min-height: 100vh;
  padding: 1.25rem;
}

.wrap { max-width: 560px; margin: 0 auto; }

.loading {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--muted);
  font-size: 0.75rem;
}

.error-box {
  background: rgba(248,113,113,0.08);
  border: 0.5px solid rgba(248,113,113,0.3);
  border-radius: 8px;
  padding: 1rem;
  color: var(--red);
  font-size: 0.7rem;
  margin-bottom: 1rem;
  display: none;
}

header {
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 0.5px solid var(--border2);
}

.brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }

.brand h1 { font-size: 1.4rem; font-weight: 300; letter-spacing: -0.02em; }
.brand h1 span { color: var(--gold); font-style: italic; }

.day-badge {
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gold);
  border: 0.5px solid var(--gold);
  padding: 0.25rem 0.6rem;
  border-radius: 2px;
}

.user-card {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(201,169,110,0.15);
  border: 0.5px solid var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  color: var(--gold);
  font-weight: 500;
  flex-shrink: 0;
}

.user-name { font-size: 1rem; font-weight: 500; }
.user-sub { font-size: 0.6rem; color: var(--muted); margin-top: 2px; }

.alert-box {
  background: rgba(251,191,36,0.08);
  border: 0.5px solid rgba(251,191,36,0.3);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  color: var(--amber);
  font-size: 0.65rem;
  margin-bottom: 1rem;
  display: none;
  line-height: 1.5;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--border);
  border: 0.5px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 1.25rem;
}

.metric { background: var(--surface); padding: 0.9rem 1rem; }
.metric-label { font-size: 0.5rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.35rem; }
.metric-value { font-size: 1.5rem; font-weight: 500; color: var(--text); line-height: 1; }
.metric-value.gold { color: var(--gold); }
.metric-value.green { color: var(--green); }
.metric-sub { font-size: 0.5rem; color: var(--muted2); margin-top: 0.2rem; }

.section-label {
  font-size: 0.55rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.6rem;
  padding-bottom: 0.35rem;
  border-bottom: 0.5px solid var(--border);
}

.card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 8px;
  padding: 1rem;
  margin-bottom: 0.75rem;
}

.overall-progress { margin-bottom: 1.25rem; }

.progress-bar-wrap {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 0.4rem;
}

.progress-label { font-size: 0.55rem; color: var(--muted); width: 70px; flex-shrink: 0; }

.progress-track {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 2px;
  transition: width 1s cubic-bezier(0.16,1,0.3,1);
}

.progress-fill.green { background: var(--green); }
.progress-pct { font-size: 0.55rem; color: var(--muted); width: 30px; text-align: right; flex-shrink: 0; }

.daily-bars {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 80px;
  margin-bottom: 0.5rem;
}

.bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; }

.bar {
  width: 100%;
  border-radius: 2px 2px 0 0;
  transition: height 0.8s cubic-bezier(0.16,1,0.3,1);
  min-height: 2px;
  cursor: default;
  position: relative;
}

.bar.future {
  border: 0.5px dashed var(--border2);
  background: transparent;
}

.bar-label { font-size: 0.45rem; color: var(--muted2); }
.bar-score { font-size: 0.45rem; color: var(--muted); }

.items-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.item-col { text-align: center; }

.item-rate {
  font-size: 0.7rem;
  font-weight: 500;
  margin-bottom: 2px;
}

.item-rate.high { color: var(--green); }
.item-rate.mid { color: var(--amber); }
.item-rate.low { color: var(--red); }

.item-bar-track {
  height: 40px;
  background: rgba(255,255,255,0.04);
  border-radius: 2px;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  margin-bottom: 3px;
}

.item-bar-fill {
  width: 100%;
  border-radius: 2px;
  transition: height 0.8s cubic-bezier(0.16,1,0.3,1);
}

.item-name { font-size: 0.4rem; color: var(--muted2); }

.motivasi {
  background: rgba(201,169,110,0.06);
  border: 0.5px solid rgba(201,169,110,0.2);
  border-radius: 8px;
  padding: 1rem;
  margin-bottom: 0.75rem;
  font-size: 0.7rem;
  color: var(--gold);
  line-height: 1.6;
  font-style: italic;
}

.streak-display {
  display: flex;
  gap: 3px;
  flex-wrap: wrap;
}

.streak-dot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.45rem;
}

.streak-dot.done { background: rgba(74,222,128,0.2); border: 0.5px solid var(--green); color: var(--green); }
.streak-dot.miss { background: rgba(248,113,113,0.08); border: 0.5px solid rgba(248,113,113,0.3); color: var(--red); }
.streak-dot.future { background: rgba(255,255,255,0.03); border: 0.5px dashed var(--border); }

footer {
  border-top: 0.5px solid var(--border);
  padding-top: 0.75rem;
  margin-top: 1.5rem;
  font-size: 0.55rem;
  color: var(--muted2);
  text-align: center;
  line-height: 1.6;
}

.refresh-btn {
  background: none;
  border: 0.5px solid var(--border2);
  border-radius: 4px;
  color: var(--muted);
  font-family: inherit;
  font-size: 0.55rem;
  padding: 0.25rem 0.6rem;
  cursor: pointer;
  margin-top: 0.5rem;
}

.refresh-btn:hover { border-color: var(--gold); color: var(--gold); }

@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.card { animation: fadeIn 0.3s ease both; }
.card:nth-child(2) { animation-delay: 0.05s; }
.card:nth-child(3) { animation-delay: 0.1s; }
.card:nth-child(4) { animation-delay: 0.15s; }
</style>
</head>
<body>
<div class="wrap">
  <div class="loading" id="loadingState">Memuat data...</div>
  <div class="error-box" id="errorBox"></div>
  <div id="mainContent" style="display:none;">
    <header>
      <div class="brand">
        <h1>Reset <span>14</span></h1>
        <div class="day-badge" id="dayBadge">Hari ke-? / 14</div>
      </div>
      <div class="user-card">
        <div class="avatar" id="userAvatar">--</div>
        <div>
          <div class="user-name" id="userName">--</div>
          <div class="user-sub" id="userSub">--</div>
        </div>
      </div>
    </header>

    <div class="alert-box" id="alertBox"></div>
    <div class="motivasi" id="motivasiBox"></div>

    <div class="metrics" id="metricsRow"></div>

    <div class="overall-progress card">
      <div class="section-label">Progress keseluruhan</div>
      <div class="progress-bar-wrap">
        <div class="progress-label">Total poin</div>
        <div class="progress-track"><div class="progress-fill" id="progTotal" style="width:0%"></div></div>
        <div class="progress-pct" id="progTotalPct">0%</div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-label">Rata-rata/hari</div>
        <div class="progress-track"><div class="progress-fill green" id="progAvg" style="width:0%"></div></div>
        <div class="progress-pct" id="progAvgPct">0</div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Skor harian</div>
      <div class="daily-bars" id="dailyBars"></div>
    </div>

    <div class="card">
      <div class="section-label">Konsistensi per item</div>
      <div class="items-grid" id="itemsGrid"></div>
    </div>

    <div class="card">
      <div class="section-label">Streak 14 hari</div>
      <div class="streak-display" id="streakDisplay"></div>
    </div>

    <footer>
      <div id="lastUpdateText"></div>
      <button class="refresh-btn" onclick="loadData()">Refresh data</button>
    </footer>
  </div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTY3RRCYv1SzBFHvF7VjMIxAy9q4uP-OgygsJHEvm9bGCzoTmjGXYJoIj6utfkwJQ4ShWb6Rlv2HeAH/pub?gid=0&single=true&output=csv';
const ITEMS = ['Aloe','Digestive','OPC3','Water','Steps','Protein','Sleep'];
const TOTAL_DAYS = 14;

function getNameFromURL() {
  const params = new URLSearchParams(window.location.search);
  return params.get('name') || 'Beny';
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/"/g,''));
  return lines.slice(1).map(line => {
    const vals = line.split(',').map(v => v.trim().replace(/"/g,''));
    const obj = {};
    headers.forEach((h, i) => obj[h] = vals[i] || '');
    return obj;
  });
}

function getMotivasi(pct, streak) {
  if (pct >= 90) return "Luar biasa! Konsistensimu di atas rata-rata. Tinggal sedikit lagi — finish strong!";
  if (pct >= 70) return "Bagus sekali! Kamu sudah lebih dari setengah jalan dengan performa yang solid.";
  if (pct >= 50) return "Progress yang baik. Setiap hari konsisten lebih baik dari hari sebelumnya.";
  if (streak >= 2) return "Streak bagus! Pertahankan momentum ini — konsistensi adalah kuncinya.";
  return "Hari ini adalah kesempatan baru. Mulai dengan satu kebiasaan, sisanya akan mengikuti.";
}

function checkBelumIsi(entries, hariKe) {
  if (!entries.length) return false;
  const today = new Date();
  const latestEntry = entries[entries.length - 1];
  const latestTanggal = latestEntry.Tanggal ? new Date(latestEntry.Tanggal) : null;
  if (!latestTanggal) return false;
  const diffMs = today - latestTanggal;
  const diffHours = diffMs / (1000 * 60 * 60);
  return diffHours > 20;
}

function getStreak(entries) {
  let streak = 0;
  const sorted = [...entries].sort((a,b) => b.Hari - a.Hari);
  for (const e of sorted) {
    if (parseInt(e.Total) > 0) streak++;
    else break;
  }
  return streak;
}

async function loadData() {
  document.getElementById('loadingState').style.display = 'block';
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('errorBox').style.display = 'none';

  const userName = getNameFromURL();

  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now());
    if (!res.ok) throw new Error('Gagal fetch data');
    const text = await res.text();
    const allData = parseCSV(text);
    const entries = allData.filter(r => r.Nama && r.Nama.toLowerCase() === userName.toLowerCase());

    if (!entries.length) {
      document.getElementById('errorBox').textContent = `Data untuk "${userName}" tidak ditemukan di sheet.`;
      document.getElementById('errorBox').style.display = 'block';
      document.getElementById('loadingState').style.display = 'none';
      return;
    }

    renderDashboard(userName, entries);
  } catch (err) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('errorBox').textContent = 'Gagal memuat data. Cek koneksi internet dan coba refresh.';
    document.getElementById('errorBox').style.display = 'block';
  }
}

function renderDashboard(userName, entries) {
  const hariKe = Math.max(...entries.map(e => parseInt(e.Hari) || 0));
  const totalScore = entries.reduce((s,e) => s + (parseInt(e.Total)||0), 0);
  const maxScore = hariKe * 7;
  const pct = maxScore ? Math.round(totalScore/maxScore*100) : 0;
  const avg = entries.length ? (totalScore/entries.length).toFixed(1) : '0.0';
  const streak = getStreak(entries);
  const belumIsi = checkBelumIsi(entries, hariKe);

  document.getElementById('userAvatar').textContent = userName.slice(0,2).toUpperCase();
  document.getElementById('userName').textContent = userName;
  document.getElementById('userSub').textContent = `Reset 14 · ${entries.length} hari recorded`;
  document.getElementById('dayBadge').textContent = `Hari ke-${hariKe} / ${TOTAL_DAYS}`;
  document.getElementById('lastUpdateText').textContent = 'Data dari Google Sheets · ' + new Date().toLocaleString('id-ID', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

  if (belumIsi) {
    document.getElementById('alertBox').textContent = `⚠ Kamu belum isi checklist hari ini. Jangan lupa update di bot Telegram!`;
    document.getElementById('alertBox').style.display = 'block';
  }

  document.getElementById('motivasiBox').textContent = getMotivasi(pct, streak);

  document.getElementById('metricsRow').innerHTML = `
    <div class="metric"><div class="metric-label">Total poin</div><div class="metric-value gold">${totalScore}</div><div class="metric-sub">dari ${maxScore} maks</div></div>
    <div class="metric"><div class="metric-label">Avg/hari</div><div class="metric-value">${avg}</div><div class="metric-sub">dari 7</div></div>
    <div class="metric"><div class="metric-label">Streak</div><div class="metric-value green">${streak}</div><div class="metric-sub">hari berturut</div></div>
  `;

  setTimeout(() => {
    document.getElementById('progTotal').style.width = pct + '%';
    document.getElementById('progTotalPct').textContent = pct + '%';
    document.getElementById('progAvg').style.width = Math.round(parseFloat(avg)/7*100) + '%';
    document.getElementById('progAvgPct').textContent = avg;
  }, 100);

  const dailyBars = document.getElementById('dailyBars');
  dailyBars.innerHTML = '';
  for (let d = 1; d <= TOTAL_DAYS; d++) {
    const entry = entries.find(e => parseInt(e.Hari) === d);
    const score = entry ? (parseInt(entry.Total)||0) : 0;
    const isFuture = d > hariKe;
    const heightPct = isFuture ? 0 : Math.max(score/7*100, 3);
    const color = score >= 6 ? '#4ade80' : score >= 4 ? '#C9A96E' : score >= 1 ? '#fbbf24' : '#f87171';

    const wrap = document.createElement('div');
    wrap.className = 'bar-wrap';
    wrap.innerHTML = `
      <div class="bar-score">${isFuture ? '' : score}</div>
      <div class="bar ${isFuture?'future':''}" style="height:0%;background:${isFuture?'transparent':color};" data-h="${heightPct}"></div>
      <div class="bar-label">${d}</div>
    `;
    dailyBars.appendChild(wrap);
  }
  setTimeout(() => {
    document.querySelectorAll('.bar[data-h]').forEach(b => { b.style.height = b.dataset.h + '%'; });
  }, 150);

  const itemsGrid = document.getElementById('itemsGrid');
  itemsGrid.innerHTML = '';
  ITEMS.forEach((item, idx) => {
    const cols = ['Aloe','Digestive','OPC3','Water','Steps','Protein','Sleep'];
    const colName = cols[idx];
    const doneCount = entries.filter(e => parseInt(e[colName]||'0') === 1).length;
    const rate = entries.length ? Math.round(doneCount/entries.length*100) : 0;
    const rateClass = rate >= 70 ? 'high' : rate >= 40 ? 'mid' : 'low';
    const fillColor = rate >= 70 ? '#4ade80' : rate >= 40 ? '#fbbf24' : '#f87171';

    const col = document.createElement('div');
    col.className = 'item-col';
    col.innerHTML = `
      <div class="item-rate ${rateClass}">${rate}%</div>
      <div class="item-bar-track">
        <div class="item-bar-fill" style="height:0%;background:${fillColor};" data-h="${rate}"></div>
      </div>
      <div class="item-name">${item.slice(0,4)}</div>
    `;
    itemsGrid.appendChild(col);
  });
  setTimeout(() => {
    document.querySelectorAll('.item-bar-fill[data-h]').forEach(b => { b.style.height = b.dataset.h + '%'; });
  }, 200);

  const streakDisplay = document.getElementById('streakDisplay');
  streakDisplay.innerHTML = '';
  for (let d = 1; d <= TOTAL_DAYS; d++) {
    const entry = entries.find(e => parseInt(e.Hari) === d);
    const isFuture = d > hariKe;
    const done = entry && parseInt(entry.Total) > 0;
    const dot = document.createElement('div');
    dot.className = `streak-dot ${isFuture?'future':done?'done':'miss'}`;
    dot.textContent = d;
    dot.title = isFuture ? `Hari ${d}` : `Hari ${d}: ${entry?entry.Total:0}/7`;
    streakDisplay.appendChild(dot);
  }

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
}

loadData();
</script>
</body>
</html>
