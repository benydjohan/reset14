<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset 14 — Dashboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0d0d;
  --surface: #141414;
  --surface2: #1a1a1a;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --gold: #C9A96E;
  --gold2: #e8c98a;
  --text: #f0ede8;
  --muted: rgba(240,237,232,0.45);
  --muted2: rgba(240,237,232,0.25);
  --green: #4ade80;
  --red: #f87171;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace;
  min-height: 100vh;
  padding: 1.25rem;
}

.wrap { max-width: 900px; margin: 0 auto; }

header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 0.5px solid var(--border2);
  gap: 1rem;
}

.brand h1 {
  font-size: clamp(1.4rem, 5vw, 2rem);
  font-weight: 300;
  color: var(--text);
  line-height: 1;
  letter-spacing: -0.02em;
}

.brand h1 span { color: var(--gold); font-style: italic; }
.brand p { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 0.3rem; }

.header-right { text-align: right; flex-shrink: 0; }

.day-badge {
  display: inline-block;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gold);
  border: 0.5px solid var(--gold);
  padding: 0.25rem 0.6rem;
  border-radius: 2px;
  margin-bottom: 0.4rem;
}

.last-update { font-size: 0.6rem; color: var(--muted2); }

.metrics {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--border);
  border: 0.5px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 1.5rem;
}

@media (min-width: 480px) {
  .metrics { grid-template-columns: repeat(4, 1fr); }
}

.metric {
  background: var(--surface);
  padding: 1rem 1.25rem;
}

.metric-label { font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
.metric-value { font-size: clamp(1.4rem, 4vw, 1.8rem); font-weight: 500; color: var(--text); line-height: 1; }
.metric-value.gold { color: var(--gold); }
.metric-sub { font-size: 0.55rem; color: var(--muted2); margin-top: 0.25rem; }

.tab-row {
  display: flex;
  gap: 0;
  margin-bottom: 1.25rem;
  border-bottom: 0.5px solid var(--border);
  overflow-x: auto;
}

.tab {
  font-family: inherit;
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  background: none;
  border: none;
  padding: 0.6rem 1rem;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -0.5px;
  white-space: nowrap;
}

.tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab-content { display: none; }
.tab-content.active { display: block; }

.section-label {
  font-size: 0.55rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.75rem;
  padding-bottom: 0.4rem;
  border-bottom: 0.5px solid var(--border);
}

.participant-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 8px;
  padding: 1.25rem;
  margin-bottom: 0.75rem;
}

.p-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
  gap: 0.75rem;
}

.p-name-wrap { display: flex; align-items: center; gap: 0.6rem; }

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(201,169,110,0.15);
  border: 0.5px solid var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  color: var(--gold);
  font-weight: 500;
  flex-shrink: 0;
}

.p-name { font-size: 0.85rem; font-weight: 500; }
.p-days { font-size: 0.6rem; color: var(--muted); margin-top: 2px; }

.score-num { font-size: 1.8rem; font-weight: 300; color: var(--gold); line-height: 1; text-align: right; }
.score-label { font-size: 0.55rem; color: var(--muted2); text-align: right; }

.progress-bar-wrap {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 0.35rem;
}

.progress-label { font-size: 0.55rem; color: var(--muted); width: 55px; flex-shrink: 0; }

.progress-track {
  flex: 1;
  height: 3px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 2px;
  transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
}

.progress-fill.green { background: var(--green); }
.progress-pct { font-size: 0.55rem; color: var(--muted); width: 28px; text-align: right; flex-shrink: 0; }

.checklist-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  margin-top: 0.75rem;
}

.check-item { text-align: center; }

.check-dot {
  width: 100%;
  aspect-ratio: 1;
  max-width: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 3px;
  font-size: 0.5rem;
}

.check-dot.done { background: rgba(74,222,128,0.15); border: 0.5px solid var(--green); color: var(--green); }
.check-dot.miss { background: rgba(248,113,113,0.08); border: 0.5px solid rgba(248,113,113,0.3); color: var(--red); }
.check-name { font-size: 0.45rem; color: var(--muted2); }

.heatmap-grid {
  display: grid;
  grid-template-columns: 50px repeat(14, 1fr);
  gap: 2px;
  align-items: center;
}

.heatmap-day-label { font-size: 0.5rem; color: var(--muted2); text-align: center; }
.heatmap-name { font-size: 0.6rem; color: var(--text); }

.heatmap-cell {
  height: 20px;
  border-radius: 2px;
}

.heatmap-cell.empty { background: rgba(255,255,255,0.04); border: 0.5px solid var(--border); }
.heatmap-cell.future { background: rgba(255,255,255,0.02); border: 0.5px dashed var(--border); }

.legend { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.6rem; justify-content: flex-end; }
.legend-label { font-size: 0.5rem; color: var(--muted2); }
.legend-cells { display: flex; gap: 2px; }
.legend-cell { width: 14px; height: 14px; border-radius: 2px; }

.input-section {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 8px;
  padding: 1.25rem;
}

.input-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
  margin-bottom: 0.75rem;
}

@media (min-width: 480px) {
  .input-grid { grid-template-columns: 1fr 1fr 1fr auto; }
}

.field label {
  display: block;
  font-size: 0.55rem;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 0.35rem;
}

.field input, .field select {
  width: 100%;
  background: var(--surface2);
  border: 0.5px solid var(--border2);
  border-radius: 4px;
  color: var(--text);
  font-family: inherit;
  font-size: 0.75rem;
  padding: 0.45rem 0.65rem;
  outline: none;
}

.field input:focus, .field select:focus { border-color: var(--gold); }

.btn-add {
  background: var(--gold);
  color: #0d0d0d;
  border: none;
  border-radius: 4px;
  font-family: inherit;
  font-size: 0.65rem;
  font-weight: 500;
  padding: 0.45rem 1rem;
  cursor: pointer;
  white-space: nowrap;
  grid-column: span 2;
}

@media (min-width: 480px) {
  .btn-add { grid-column: auto; align-self: end; }
}

.checklist-toggles { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-top: 0.5rem; }

.toggle-btn {
  font-family: inherit;
  font-size: 0.55rem;
  padding: 0.25rem 0.5rem;
  border-radius: 3px;
  border: 0.5px solid var(--border2);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}

.toggle-btn.active { background: rgba(201,169,110,0.15); border-color: var(--gold); color: var(--gold); }

footer {
  border-top: 0.5px solid var(--border);
  padding-top: 0.75rem;
  margin-top: 1.5rem;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.5rem;
}

footer p { font-size: 0.55rem; color: var(--muted2); }

.status-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--green);
  display: inline-block;
  margin-right: 0.3rem;
  animation: pulse 2s infinite;
}

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

.participant-card { animation: fadeIn 0.3s ease both; }
.participant-card:nth-child(2) { animation-delay: 0.1s; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">
    <h1>Reset <span>14</span></h1>
    <p>Admin Dashboard</p>
  </div>
  <div class="header-right">
    <div class="day-badge" id="dayBadge">Hari ke-3 / 14</div>
    <div class="last-update" id="lastUpdate"></div>
  </div>
</header>

<div class="metrics" id="metricsRow"></div>

<div class="tab-row">
  <button class="tab active" onclick="switchTab('overview')">Overview</button>
  <button class="tab" onclick="switchTab('heatmap')">Heatmap</button>
  <button class="tab" onclick="switchTab('input')">Input</button>
</div>

<div class="tab-content active" id="tab-overview">
  <div id="participantCards"></div>
</div>

<div class="tab-content" id="tab-heatmap">
  <div class="section-label">Konsistensi 14 hari</div>
  <div class="heatmap-grid" id="heatmapGrid"></div>
  <div class="legend">
    <span class="legend-label">0</span>
    <div class="legend-cells" id="legendCells"></div>
    <span class="legend-label">7</span>
  </div>
</div>

<div class="tab-content" id="tab-input">
  <div class="input-section">
    <div class="section-label">Tambah data checklist</div>
    <div class="input-grid">
      <div class="field">
        <label>Peserta</label>
        <select id="inp-name">
          <option>Beny</option>
          <option>Dodo</option>
        </select>
      </div>
      <div class="field">
        <label>Hari ke</label>
        <input type="number" id="inp-hari" min="1" max="14" value="4">
      </div>
      <div class="field">
        <label>Total skor</label>
        <input type="number" id="inp-total" min="0" max="7" value="0">
      </div>
      <button class="btn-add" onclick="addEntry()">+ Tambah</button>
    </div>
    <div class="section-label">Checklist selesai</div>
    <div class="checklist-toggles" id="checkToggles"></div>
  </div>
</div>

<footer>
  <p><span class="status-dot"></span>Auto-increment 06:00 WIB · Reminder 06:30 WIB</p>
  <p id="footerDate"></p>
</footer>

</div>
<script>
const ITEMS = ['Aloe','Digestive','OPC3','Water','Steps','Protein','Sleep'];
const TOTAL_DAYS = 14;

let data = {
  peserta: [
    { name: 'Beny', hariKe: 3, active: 1 },
    { name: 'Dodo', hariKe: 3, active: 1 }
  ],
  entries: [
    { name: 'Beny', hari: 1, total: 0, checks: [0,0,0,0,0,0,0] },
    { name: 'Beny', hari: 2, total: 7, checks: [1,1,1,1,1,1,1] },
    { name: 'Beny', hari: 3, total: 4, checks: [1,1,1,1,0,0,0] },
    { name: 'Dodo', hari: 1, total: 1, checks: [1,0,0,0,0,0,0] },
    { name: 'Dodo', hari: 2, total: 3, checks: [1,0,0,1,0,0,1] },
    { name: 'Dodo', hari: 3, total: 1, checks: [0,0,0,0,1,0,0] },
  ]
};

let selectedChecks = {};
ITEMS.forEach(i => selectedChecks[i] = false);

function getColor(score) {
  if (score === 0) return 'rgba(255,255,255,0.04)';
  const p = score / 7;
  if (p <= 0.28) return 'rgba(201,169,110,0.2)';
  if (p <= 0.57) return 'rgba(201,169,110,0.45)';
  if (p <= 0.85) return 'rgba(201,169,110,0.7)';
  return '#C9A96E';
}

function getTotalScore(name) {
  return data.entries.filter(e => e.name === name).reduce((s,e) => s + e.total, 0);
}

function getAvgScore(name) {
  const entries = data.entries.filter(e => e.name === name);
  if (!entries.length) return '0.0';
  return (entries.reduce((s,e) => s + e.total, 0) / entries.length).toFixed(1);
}

function getLatestEntry(name) {
  return data.entries.filter(e => e.name === name).sort((a,b) => b.hari - a.hari)[0];
}

function renderMetrics() {
  const allEntries = data.entries;
  const totalPts = allEntries.reduce((s,e) => s + e.total, 0);
  const maxPts = allEntries.length * 7;
  const pct = maxPts ? Math.round(totalPts / maxPts * 100) : 0;
  const currentDay = Math.max(...data.peserta.map(p => p.hariKe));
  document.getElementById('metricsRow').innerHTML = `
    <div class="metric"><div class="metric-label">Hari berjalan</div><div class="metric-value gold">${currentDay}</div><div class="metric-sub">dari 14 hari</div></div>
    <div class="metric"><div class="metric-label">Peserta</div><div class="metric-value">${data.peserta.length}</div><div class="metric-sub">aktif</div></div>
    <div class="metric"><div class="metric-label">Compliance</div><div class="metric-value gold">${pct}%</div><div class="metric-sub">${totalPts}/${maxPts} poin</div></div>
    <div class="metric"><div class="metric-label">Hari tersisa</div><div class="metric-value">${TOTAL_DAYS - currentDay}</div><div class="metric-sub">hari lagi</div></div>
  `;
}

function renderCards() {
  const container = document.getElementById('participantCards');
  container.innerHTML = '';
  data.peserta.forEach((p, idx) => {
    const totalScore = getTotalScore(p.name);
    const avgScore = getAvgScore(p.name);
    const maxScore = p.hariKe * 7;
    const pct = maxScore ? Math.round(totalScore / maxScore * 100) : 0;
    const latest = getLatestEntry(p.name);
    const checksHtml = ITEMS.map((item, i) => {
      const done = latest ? latest.checks[i] : 0;
      return `<div class="check-item"><div class="check-dot ${done?'done':'miss'}">${done?'✓':'×'}</div><div class="check-name">${item.slice(0,4)}</div></div>`;
    }).join('');
    const card = document.createElement('div');
    card.className = 'participant-card';
    card.style.animationDelay = `${idx*0.1}s`;
    card.innerHTML = `
      <div class="p-header">
        <div class="p-name-wrap">
          <div class="avatar">${p.name.slice(0,2).toUpperCase()}</div>
          <div><div class="p-name">${p.name}</div><div class="p-days">Hari ke-${p.hariKe} / ${TOTAL_DAYS}</div></div>
        </div>
        <div><div class="score-num">${totalScore}</div><div class="score-label">total poin</div></div>
      </div>
      <div class="progress-bar-wrap"><div class="progress-label">Progress</div><div class="progress-track"><div class="progress-fill" style="width:0%" data-target="${pct}"></div></div><div class="progress-pct">${pct}%</div></div>
      <div class="progress-bar-wrap"><div class="progress-label">Avg/hari</div><div class="progress-track"><div class="progress-fill green" style="width:0%" data-target="${Math.round(avgScore/7*100)}"></div></div><div class="progress-pct">${avgScore}</div></div>
      <div class="section-label" style="margin-top:0.75rem;margin-bottom:0.5rem;">Hari ke-${p.hariKe}</div>
      <div class="checklist-grid">${checksHtml}</div>
    `;
    container.appendChild(card);
  });
  setTimeout(() => {
    document.querySelectorAll('.progress-fill[data-target]').forEach(el => { el.style.width = el.dataset.target + '%'; });
  }, 100);
}

function renderHeatmap() {
  const grid = document.getElementById('heatmapGrid');
  grid.innerHTML = '';
  const currentDay = Math.max(...data.peserta.map(p => p.hariKe));
  const blank = document.createElement('div');
  grid.appendChild(blank);
  for (let d = 1; d <= TOTAL_DAYS; d++) {
    const lbl = document.createElement('div');
    lbl.className = 'heatmap-day-label';
    lbl.textContent = d;
    grid.appendChild(lbl);
  }
  data.peserta.forEach(p => {
    const nameLbl = document.createElement('div');
    nameLbl.className = 'heatmap-name';
    nameLbl.textContent = p.name;
    grid.appendChild(nameLbl);
    for (let d = 1; d <= TOTAL_DAYS; d++) {
      const entry = data.entries.find(e => e.name === p.name && e.hari === d);
      const cell = document.createElement('div');
      cell.className = 'heatmap-cell';
      if (d > currentDay) { cell.classList.add('future'); }
      else if (!entry) { cell.classList.add('empty'); }
      else { cell.style.background = getColor(entry.total); cell.title = `${p.name} H${d}: ${entry.total}/7`; }
      grid.appendChild(cell);
    }
  });
  const legend = document.getElementById('legendCells');
  legend.innerHTML = '';
  [0,2,4,5,7].forEach(s => {
    const c = document.createElement('div');
    c.className = 'legend-cell';
    c.style.background = getColor(s);
    if (s === 0) c.style.border = '0.5px solid rgba(255,255,255,0.07)';
    legend.appendChild(c);
  });
}

function renderCheckToggles() {
  const wrap = document.getElementById('checkToggles');
  wrap.innerHTML = '';
  ITEMS.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'toggle-btn' + (selectedChecks[item] ? ' active' : '');
    btn.textContent = item;
    btn.onclick = () => {
      selectedChecks[item] = !selectedChecks[item];
      btn.classList.toggle('active');
      document.getElementById('inp-total').value = Object.values(selectedChecks).filter(Boolean).length;
    };
    wrap.appendChild(btn);
  });
}

function addEntry() {
  const name = document.getElementById('inp-name').value;
  const hari = parseInt(document.getElementById('inp-hari').value);
  const total = parseInt(document.getElementById('inp-total').value);
  const checks = ITEMS.map(i => selectedChecks[i] ? 1 : 0);
  const existing = data.entries.findIndex(e => e.name === name && e.hari === hari);
  if (existing >= 0) { data.entries[existing] = { name, hari, total, checks }; }
  else { data.entries.push({ name, hari, total, checks }); }
  const p = data.peserta.find(p => p.name === name);
  if (p && hari > p.hariKe) p.hariKe = hari;
  ITEMS.forEach(i => selectedChecks[i] = false);
  renderAll();
  switchTab('overview');
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['overview','heatmap','input'][i] === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + tab));
}

function renderAll() {
  const now = new Date();
  const currentDay = Math.max(...data.peserta.map(p => p.hariKe));
  document.getElementById('dayBadge').textContent = `Hari ke-${currentDay} / ${TOTAL_DAYS}`;
  document.getElementById('lastUpdate').textContent = now.toLocaleString('id-ID', {hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});
  document.getElementById('footerDate').textContent = now.toLocaleDateString('id-ID', {weekday:'long',day:'numeric',month:'long',year:'numeric'});
  renderMetrics();
  renderCards();
  renderHeatmap();
  renderCheckToggles();
}

renderAll();
</script>
</body>
</html>
