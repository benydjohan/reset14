<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset 14 — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --surface: #141414;
    --surface2: #1a1a1a;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --gold: #C9A96E;
    --gold2: #e8c98a;
    --text: #f0ede8;
    --muted: rgba(240,237,232,0.45);
    --muted2: rgba(240,237,232,0.25);
    --green: #4ade80;
    --red: #f87171;
    --amber: #fbbf24;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 2rem;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -30%;
    right: -20%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(201,169,110,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap { max-width: 960px; margin: 0 auto; position: relative; z-index: 1; }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 0.5px solid var(--border2);
  }

  .brand h1 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 2rem;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1;
  }

  .brand h1 span { color: var(--gold); font-style: italic; }

  .brand p {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 0.4rem;
  }

  .header-right { text-align: right; }

  .day-badge {
    display: inline-block;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    border: 0.5px solid var(--gold);
    padding: 0.3rem 0.75rem;
    border-radius: 2px;
    margin-bottom: 0.5rem;
  }

  .last-update {
    font-size: 0.65rem;
    color: var(--muted2);
    letter-spacing: 0.05em;
  }

  .metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 2rem;
  }

  .metric {
    background: var(--surface);
    padding: 1.25rem 1.5rem;
    transition: background 0.2s;
  }

  .metric:hover { background: var(--surface2); }

  .metric-label {
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.6rem;
  }

  .metric-value {
    font-size: 1.8rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1;
  }

  .metric-value.gold { color: var(--gold); }
  .metric-sub {
    font-size: 0.6rem;
    color: var(--muted2);
    margin-top: 0.3rem;
  }

  .section-label {
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 0.5px solid var(--border);
  }

  .participants { margin-bottom: 2rem; }

  .participant-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 1px;
    transition: border-color 0.2s;
    animation: fadeIn 0.4s ease both;
  }

  .participant-card:hover { border-color: var(--border2); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .participant-card:nth-child(2) { animation-delay: 0.1s; }

  .p-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }

  .p-name-wrap { display: flex; align-items: center; gap: 0.75rem; }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(201,169,110,0.15);
    border: 0.5px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: var(--gold);
    font-weight: 500;
    flex-shrink: 0;
  }

  .p-name { font-size: 0.9rem; font-weight: 500; color: var(--text); }
  .p-days { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }

  .p-score {
    text-align: right;
  }

  .score-num {
    font-family: 'Fraunces', serif;
    font-size: 2rem;
    font-weight: 300;
    color: var(--gold);
    line-height: 1;
  }

  .score-label { font-size: 0.6rem; color: var(--muted2); margin-top: 2px; }

  .progress-section { margin-bottom: 1.25rem; }

  .progress-bar-wrap {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.4rem;
  }

  .progress-label { font-size: 0.6rem; color: var(--muted); width: 60px; flex-shrink: 0; }

  .progress-track {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 2px;
    transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .progress-fill.green { background: var(--green); }
  .progress-fill.red { background: var(--red); }

  .progress-pct { font-size: 0.6rem; color: var(--muted); width: 30px; text-align: right; flex-shrink: 0; }

  .checklist-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .check-item {
    text-align: center;
  }

  .check-dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 4px;
    font-size: 0.55rem;
    transition: all 0.2s;
  }

  .check-dot.done {
    background: rgba(74,222,128,0.15);
    border: 0.5px solid var(--green);
    color: var(--green);
  }

  .check-dot.miss {
    background: rgba(248,113,113,0.08);
    border: 0.5px solid rgba(248,113,113,0.3);
    color: var(--red);
  }

  .check-name { font-size: 0.5rem; color: var(--muted2); letter-spacing: 0.05em; }

  .heatmap-section { margin-bottom: 2rem; }

  .heatmap-grid {
    display: grid;
    grid-template-columns: 80px repeat(14, 1fr);
    gap: 3px;
    align-items: center;
  }

  .heatmap-label { font-size: 0.6rem; color: var(--muted); }

  .heatmap-day-label {
    font-size: 0.55rem;
    color: var(--muted2);
    text-align: center;
  }

  .heatmap-name { font-size: 0.65rem; color: var(--text); }

  .heatmap-cell {
    height: 24px;
    border-radius: 3px;
    transition: opacity 0.2s;
    position: relative;
    cursor: default;
  }

  .heatmap-cell:hover { opacity: 0.8; }

  .heatmap-cell.empty {
    background: rgba(255,255,255,0.04);
    border: 0.5px solid var(--border);
  }

  .heatmap-cell.future {
    background: rgba(255,255,255,0.02);
    border: 0.5px dashed var(--border);
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.75rem;
    justify-content: flex-end;
  }

  .legend-label { font-size: 0.55rem; color: var(--muted2); }

  .legend-cells { display: flex; gap: 3px; }

  .legend-cell {
    width: 16px;
    height: 16px;
    border-radius: 2px;
  }

  .input-section {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 2rem;
  }

  .input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 0.75rem;
    align-items: end;
  }

  .field label {
    display: block;
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  .field input, .field select {
    width: 100%;
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: 4px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    padding: 0.5rem 0.75rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .field input:focus, .field select:focus { border-color: var(--gold); }

  .btn-add {
    background: var(--gold);
    color: #0d0d0d;
    border: none;
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    font-weight: 500;
    padding: 0.5rem 1.25rem;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  .btn-add:hover { background: var(--gold2); }
  .btn-add:active { transform: scale(0.97); }

  .checklist-input {
    margin-top: 1rem;
  }

  .checklist-input-label {
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .checklist-toggles {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
  }

  .toggle-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    padding: 0.3rem 0.6rem;
    border-radius: 3px;
    border: 0.5px solid var(--border2);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
  }

  .toggle-btn.active {
    background: rgba(201,169,110,0.15);
    border-color: var(--gold);
    color: var(--gold);
  }

  footer {
    border-top: 0.5px solid var(--border);
    padding-top: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  footer p { font-size: 0.6rem; color: var(--muted2); letter-spacing: 0.06em; }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
    margin-right: 0.4rem;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .tab-row {
    display: flex;
    gap: 0;
    margin-bottom: 1.5rem;
    border-bottom: 0.5px solid var(--border);
  }

  .tab {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: none;
    padding: 0.6rem 1.25rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -0.5px;
    transition: all 0.2s;
  }

  .tab.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>Reset <span>14</span></h1>
      <p>Admin Dashboard &mdash; Wellness Tracker</p>
    </div>
    <div class="header-right">
      <div class="day-badge" id="dayBadge">Hari ke-3 / 14</div>
      <div class="last-update" id="lastUpdate">Loading...</div>
    </div>
  </header>

  <div class="metrics" id="metricsRow"></div>

  <div class="tab-row">
    <button class="tab active" onclick="switchTab('overview')">Overview</button>
    <button class="tab" onclick="switchTab('heatmap')">Heatmap</button>
    <button class="tab" onclick="switchTab('input')">Input Data</button>
  </div>

  <div class="tab-content active" id="tab-overview">
    <div class="participants" id="participantCards"></div>
  </div>

  <div class="tab-content" id="tab-heatmap">
    <div class="heatmap-section">
      <div class="section-label">Konsistensi per hari (14 hari)</div>
      <div class="heatmap-grid" id="heatmapGrid"></div>
      <div class="legend">
        <span class="legend-label">0</span>
        <div class="legend-cells" id="legendCells"></div>
        <span class="legend-label">7</span>
      </div>
    </div>
  </div>

  <div class="tab-content" id="tab-input">
    <div class="input-section">
      <div class="section-label">Tambah data checklist harian</div>
      <div class="input-grid">
        <div class="field">
          <label>Peserta</label>
          <select id="inp-name">
            <option value="Beny">Beny</option>
            <option value="Dodo">Dodo</option>
          </select>
        </div>
        <div class="field">
          <label>Hari ke</label>
          <input type="number" id="inp-hari" min="1" max="14" value="3">
        </div>
        <div class="field">
          <label>Total skor</label>
          <input type="number" id="inp-total" min="0" max="7" value="7">
        </div>
        <button class="btn-add" onclick="addEntry()">+ Tambah</button>
      </div>
      <div class="checklist-input">
        <div class="checklist-input-label">Checklist yang selesai</div>
        <div class="checklist-toggles" id="checkToggles"></div>
      </div>
    </div>
  </div>

  <footer>
    <p><span class="status-dot"></span>System aktif &mdash; Auto-increment 06:00 WIB &mdash; Reminder 06:30 WIB</p>
    <p id="footerDate"></p>
  </footer>

</div>

<script>
const ITEMS = ['Aloe','Digestive','OPC3','Water','Steps','Protein','Sleep'];
const TOTAL_DAYS = 14;

let data = {
  peserta: [
    { name: 'Beny', hariKe: 3, active: 1 },
    { name: 'Dodo', hariKe: 3, active: 1 }
  ],
  entries: [
    { name: 'Beny', hari: 1, total: 0, checks: [0,0,0,0,0,0,0] },
    { name: 'Beny', hari: 2, total: 7, checks: [1,1,1,1,1,1,1] },
    { name: 'Beny', hari: 3, total: 4, checks: [1,1,1,1,0,0,0] },
    { name: 'Dodo', hari: 1, total: 1, checks: [1,0,0,0,0,0,0] },
    { name: 'Dodo', hari: 2, total: 3, checks: [1,0,0,1,0,0,1] },
    { name: 'Dodo', hari: 3, total: 1, checks: [0,0,0,0,1,0,0] },
  ]
};

let selectedChecks = {};
ITEMS.forEach(i => selectedChecks[i] = false);

function getColor(score) {
  const pct = score / 7;
  if (pct === 0) return 'rgba(255,255,255,0.04)';
  if (pct <= 0.28) return 'rgba(201,169,110,0.2)';
  if (pct <= 0.57) return 'rgba(201,169,110,0.45)';
  if (pct <= 0.85) return 'rgba(201,169,110,0.7)';
  return '#C9A96E';
}

function getTotalScore(name) {
  return data.entries.filter(e => e.name === name).reduce((s, e) => s + e.total, 0);
}

function getAvgScore(name) {
  const entries = data.entries.filter(e => e.name === name);
  if (!entries.length) return 0;
  return (entries.reduce((s, e) => s + e.total, 0) / entries.length).toFixed(1);
}

function getLatestEntry(name) {
  const entries = data.entries.filter(e => e.name === name);
  return entries.sort((a,b) => b.hari - a.hari)[0];
}

function renderMetrics() {
  const allEntries = data.entries;
  const totalPts = allEntries.reduce((s, e) => s + e.total, 0);
  const maxPts = allEntries.length * 7;
  const pct = maxPts ? Math.round(totalPts / maxPts * 100) : 0;
  const currentDay = Math.max(...data.peserta.map(p => p.hariKe));
  const daysLeft = TOTAL_DAYS - currentDay;

  document.getElementById('metricsRow').innerHTML = `
    <div class="metric">
      <div class="metric-label">Hari berjalan</div>
      <div class="metric-value gold">${currentDay}</div>
      <div class="metric-sub">dari 14 hari</div>
    </div>
    <div class="metric">
      <div class="metric-label">Total peserta</div>
      <div class="metric-value">${data.peserta.length}</div>
      <div class="metric-sub">aktif</div>
    </div>
    <div class="metric">
      <div class="metric-label">Compliance rate</div>
      <div class="metric-value gold">${pct}%</div>
      <div class="metric-sub">${totalPts} / ${maxPts} poin</div>
    </div>
    <div class="metric">
      <div class="metric-label">Hari tersisa</div>
      <div class="metric-value">${daysLeft}</div>
      <div class="metric-sub">hari lagi</div>
    </div>
  `;
}

function renderCards() {
  const container = document.getElementById('participantCards');
  container.innerHTML = '';

  data.peserta.forEach((p, idx) => {
    const totalScore = getTotalScore(p.name);
    const avgScore = getAvgScore(p.name);
    const maxScore = p.hariKe * 7;
    const pct = maxScore ? Math.round(totalScore / maxScore * 100) : 0;
    const latest = getLatestEntry(p.name);
    const initials = p.name.slice(0, 2).toUpperCase();

    const checksHtml = ITEMS.map((item, i) => {
      const done = latest ? latest.checks[i] : 0;
      return `
        <div class="check-item">
          <div class="check-dot ${done ? 'done' : 'miss'}">${done ? '✓' : '×'}</div>
          <div class="check-name">${item.slice(0,4)}</div>
        </div>
      `;
    }).join('');

    const card = document.createElement('div');
    card.className = 'participant-card';
    card.style.animationDelay = `${idx * 0.1}s`;
    card.innerHTML = `
      <div class="p-header">
        <div class="p-name-wrap">
          <div class="avatar">${initials}</div>
          <div>
            <div class="p-name">${p.name}</div>
            <div class="p-days">Hari ke-${p.hariKe} dari ${TOTAL_DAYS}</div>
          </div>
        </div>
        <div class="p-score">
          <div class="score-num">${totalScore}</div>
          <div class="score-label">total poin</div>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-bar-wrap">
          <div class="progress-label">Progress</div>
          <div class="progress-track">
            <div class="progress-fill" style="width:0%" data-target="${pct}"></div>
          </div>
          <div class="progress-pct">${pct}%</div>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-label">Avg/hari</div>
          <div class="progress-track">
            <div class="progress-fill green" style="width:0%" data-target="${Math.round(avgScore/7*100)}"></div>
          </div>
          <div class="progress-pct">${avgScore}</div>
        </div>
      </div>

      <div class="section-label" style="margin-bottom:0.6rem;">Hari ke-${p.hariKe} checklist</div>
      <div class="checklist-grid">${checksHtml}</div>
    `;
    container.appendChild(card);
  });

  setTimeout(() => {
    document.querySelectorAll('.progress-fill[data-target]').forEach(el => {
      el.style.width = el.dataset.target + '%';
    });
  }, 100);
}

function renderHeatmap() {
  const grid = document.getElementById('heatmapGrid');
  grid.innerHTML = '';

  const header1 = document.createElement('div');
  header1.className = 'heatmap-label';
  header1.textContent = '';
  grid.appendChild(header1);

  for (let d = 1; d <= TOTAL_DAYS; d++) {
    const lbl = document.createElement('div');
    lbl.className = 'heatmap-day-label';
    lbl.textContent = d;
    grid.appendChild(lbl);
  }

  const currentDay = Math.max(...data.peserta.map(p => p.hariKe));

  data.peserta.forEach(p => {
    const nameLbl = document.createElement('div');
    nameLbl.className = 'heatmap-name';
    nameLbl.textContent = p.name;
    grid.appendChild(nameLbl);

    for (let d = 1; d <= TOTAL_DAYS; d++) {
      const entry = data.entries.find(e => e.name === p.name && e.hari === d);
      const cell = document.createElement('div');
      cell.className = 'heatmap-cell';

      if (d > currentDay) {
        cell.classList.add('future');
      } else if (!entry) {
        cell.classList.add('empty');
      } else {
        cell.style.background = getColor(entry.total);
        cell.title = `${p.name} Hari ${d}: ${entry.total}/7`;
      }
      grid.appendChild(cell);
    }
  });

  const legend = document.getElementById('legendCells');
  legend.innerHTML = '';
  [0, 2, 4, 5, 7].forEach(s => {
    const c = document.createElement('div');
    c.className = 'legend-cell';
    c.style.background = getColor(s);
    if (s === 0) { c.style.border = '0.5px solid rgba(255,255,255,0.07)'; }
    legend.appendChild(c);
  });
}

function renderCheckToggles() {
  const wrap = document.getElementById('checkToggles');
  wrap.innerHTML = '';
  ITEMS.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'toggle-btn' + (selectedChecks[item] ? ' active' : '');
    btn.textContent = item;
    btn.onclick = () => {
      selectedChecks[item] = !selectedChecks[item];
      btn.classList.toggle('active');
      const total = Object.values(selectedChecks).filter(Boolean).length;
      document.getElementById('inp-total').value = total;
    };
    wrap.appendChild(btn);
  });
}

function addEntry() {
  const name = document.getElementById('inp-name').value;
  const hari = parseInt(document.getElementById('inp-hari').value);
  const total = parseInt(document.getElementById('inp-total').value);
  const checks = ITEMS.map(i => selectedChecks[i] ? 1 : 0);

  const existing = data.entries.findIndex(e => e.name === name && e.hari === hari);
  if (existing >= 0) {
    data.entries[existing] = { name, hari, total, checks };
  } else {
    data.entries.push({ name, hari, total, checks });
  }

  const p = data.peserta.find(p => p.name === name);
  if (p && hari > p.hariKe) p.hariKe = hari;

  ITEMS.forEach(i => selectedChecks[i] = false);
  renderAll();
  switchTab('overview');
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['overview','heatmap','input'][i] === tab);
  });
  document.querySelectorAll('.tab-content').forEach(c => {
    c.classList.toggle('active', c.id === 'tab-' + tab);
  });
}

function renderAll() {
  const now = new Date();
  const currentDay = Math.max(...data.peserta.map(p => p.hariKe));
  document.getElementById('dayBadge').textContent = `Hari ke-${currentDay} / ${TOTAL_DAYS}`;
  document.getElementById('lastUpdate').textContent = now.toLocaleString('id-ID', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
  document.getElementById('footerDate').textContent = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  renderMetrics();
  renderCards();
  renderHeatmap();
  renderCheckToggles();
}

renderAll();
</script>
</body>
</html>
